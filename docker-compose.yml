version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: sistemamigconta-app
    ports:
      - "8000:8000"
    volumes:
      - .:/app
    environment:
      # Ajustamos los connection strings para que usen host.docker.internal
      # Esto permite que el contenedor alcance las bases de datos locales del host
      - SQL_SERVER_CONNECTION_STRING=mssql+pyodbc://sa:M%40n%40nt1%40l2025@host.docker.internal/CONTASIS?driver=ODBC+Driver+17+for+SQL+Server
      - POSTGRES_CONNECTION_STRING=postgresql://postgres:postgres@host.docker.internal:5433/migconta_db
      - API_PORT=8000
      - DEBUG=True
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
