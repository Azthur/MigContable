services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: sistemamigconta-app
    ports:
      - "9999:8000"
    volumes:
      - .:/app
    environment:
      # Ajustamos los connection strings para que usen localhost o db
      - SQL_SERVER_CONNECTION_STRING=mssql+pyodbc://sa:M%40n%40nt1%40l2025@192.168.1.17/CONTASIS?driver=ODBC+Driver+17+for+SQL+Server
      - POSTGRES_CONNECTION_STRING=${POSTGRES_CONNECTION_STRING:-postgresql://postgres:postgres@192.168.2.1:5434/migconta_db}
      - REDIS_URL=${REDIS_URL:-redis://192.168.2.1:6379/0}
      - CELERY_BROKER_URL=${CELERY_BROKER_URL:-redis://192.168.2.1:6379/0}
      - CELERY_RESULT_BACKEND=${CELERY_RESULT_BACKEND:-redis://192.168.2.1:6379/1}
      - API_PORT=8000
      - DEBUG=True
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    # Limites dimensionados para equipo destino de 8GB RAM / 4 cores
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G
        reservations:
          cpus: '0.25'
          memory: 256M

  # ─── Celery Worker ───
  celery-worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: sistemamigconta-worker
    command: celery -A backend.app.celery_app worker --loglevel=info --queues=etl --concurrency=2
    volumes:
      - .:/app
    environment:
      - SQL_SERVER_CONNECTION_STRING=mssql+pyodbc://sa:M%40n%40nt1%40l2025@192.168.1.17/CONTASIS?driver=ODBC+Driver+17+for+SQL+Server
      - POSTGRES_CONNECTION_STRING=${POSTGRES_CONNECTION_STRING:-postgresql://postgres:postgres@192.168.2.1:5434/migconta_db}
      - REDIS_URL=${REDIS_URL:-redis://192.168.2.1:6379/0}
      - CELERY_BROKER_URL=${CELERY_BROKER_URL:-redis://192.168.2.1:6379/0}
      - CELERY_RESULT_BACKEND=${CELERY_RESULT_BACKEND:-redis://192.168.2.1:6379/1}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    # Worker ETL (pandas): el mas pesado. 2.5G deja headroom en equipo de 8GB
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2500M
        reservations:
          cpus: '0.5'
          memory: 512M

  # ─── Celery Beat (Scheduler) ───
  celery-beat:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: sistemamigconta-beat
    command: celery -A backend.app.celery_app beat --scheduler=backend.app.celery_tasks.beat_scanner.DatabaseScheduler --loglevel=info
    volumes:
      - .:/app
    environment:
      - POSTGRES_CONNECTION_STRING=${POSTGRES_CONNECTION_STRING:-postgresql://postgres:postgres@192.168.2.1:5434/migconta_db}
      - REDIS_URL=${REDIS_URL:-redis://192.168.2.1:6379/0}
      - CELERY_BROKER_URL=${CELERY_BROKER_URL:-redis://192.168.2.1:6379/0}
      - CELERY_RESULT_BACKEND=${CELERY_RESULT_BACKEND:-redis://192.168.2.1:6379/1}
      - SQL_SERVER_CONNECTION_STRING=mssql+pyodbc://sa:x@localhost/x?driver=ODBC+Driver+17+for+SQL+Server
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
        reservations:
          cpus: '0.1'
          memory: 128M

  # ─── Flower (Monitoreo Web) ───
  flower:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: sistemamigconta-flower
    command: celery -A backend.app.celery_app flower --port=5555
    ports:
      - "5555:5555"
    environment:
      - CELERY_BROKER_URL=${CELERY_BROKER_URL:-redis://192.168.2.1:6379/0}
      - CELERY_RESULT_BACKEND=${CELERY_RESULT_BACKEND:-redis://192.168.2.1:6379/1}
      - REDIS_URL=${REDIS_URL:-redis://192.168.2.1:6379/0}
      - POSTGRES_CONNECTION_STRING=${POSTGRES_CONNECTION_STRING:-postgresql://postgres:postgres@192.168.2.1:5434/migconta_db}
      - SQL_SERVER_CONNECTION_STRING=mssql+pyodbc://sa:x@localhost/x?driver=ODBC+Driver+17+for+SQL+Server
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
        reservations:
          cpus: '0.1'
          memory: 128M

