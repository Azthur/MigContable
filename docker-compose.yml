version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: sistemamigconta-app
    ports:
      - "8080:8000"
    volumes:
      - .:/app
    environment:
      # Ajustamos los connection strings para que usen localhost o db
      - SQL_SERVER_CONNECTION_STRING=mssql+pyodbc://sa:M%40n%40nt1%40l2025@host.docker.internal/CONTASIS?driver=ODBC+Driver+17+for+SQL+Server
      - POSTGRES_CONNECTION_STRING=postgresql://postgres:postgres@db:5432/migconta_db
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/1
      - API_PORT=8000
      - DEBUG=True
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    depends_on:
      - db
      - redis

  # ─── Celery Worker ───
  celery-worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: sistemamigconta-worker
    command: celery -A backend.app.celery_app worker --loglevel=info --queues=etl --concurrency=4
    volumes:
      - .:/app
    environment:
      - SQL_SERVER_CONNECTION_STRING=mssql+pyodbc://sa:M%40n%40nt1%40l2025@host.docker.internal/CONTASIS?driver=ODBC+Driver+17+for+SQL+Server
      - POSTGRES_CONNECTION_STRING=postgresql://postgres:postgres@db:5432/migconta_db
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/1
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    depends_on:
      - db
      - redis

  # ─── Celery Beat (Scheduler) ───
  celery-beat:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: sistemamigconta-beat
    command: celery -A backend.app.celery_app beat --scheduler=backend.app.celery_tasks.beat_scanner.DatabaseScheduler --loglevel=info
    volumes:
      - .:/app
    environment:
      - POSTGRES_CONNECTION_STRING=postgresql://postgres:postgres@db:5432/migconta_db
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/1
      - SQL_SERVER_CONNECTION_STRING=mssql+pyodbc://sa:x@localhost/x?driver=ODBC+Driver+17+for+SQL+Server
    restart: unless-stopped
    depends_on:
      - db
      - redis

  # ─── Flower (Monitoreo Web) ───
  flower:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: sistemamigconta-flower
    command: celery -A backend.app.celery_app flower --port=5555 --broker_api=redis://redis:6379/0
    ports:
      - "5555:5555"
    environment:
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/1
      - REDIS_URL=redis://redis:6379/0
      - POSTGRES_CONNECTION_STRING=postgresql://postgres:postgres@db:5432/migconta_db
      - SQL_SERVER_CONNECTION_STRING=mssql+pyodbc://sa:x@localhost/x?driver=ODBC+Driver+17+for+SQL+Server
    restart: unless-stopped
    depends_on:
      - redis

  # ─── Redis (Broker) ───
  redis:
    image: redis:7-alpine
    container_name: sistemamigconta-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped

  db:
    image: postgres:14
    container_name: sistemamigconta-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: migconta_db
    ports:
      - "5434:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:

