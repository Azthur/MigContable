version: '3.8'

services:
  # ─── PostgreSQL (Base de datos compartida) ───
  db:
    image: postgres:17
    container_name: sistemamigconta-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: migconta_db
    ports:
      - "5434:5432"
    volumes:
      - ./postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2G
        reservations:
          cpus: '0.5'
          memory: 512M

  # ─── Redis (Broker compartido) ───
  redis:
    image: redis:7-alpine
    container_name: sistemamigconta-redis
    ports:
      - "6379:6379"
    volumes:
      - ./redis_data:/data
    restart: unless-stopped
